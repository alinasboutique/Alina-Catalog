name: Backup catalog photos
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/backup_catalog_images.py
      - .github/workflows/backup-catalog-images.yml
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download optimized images
        run: python3 scripts/backup_catalog_images.py
        env:
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_d81c4EtU4mkkqgBnVQi9HQ_nf7M2zFb
      - name: Commit copies without deleting originals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/catalog-images static/catalog-image-map.json data/catalog_categories.json data/catalog_product_photos.json data/mot_model_photos.json
          if ! git diff --cached --quiet; then
            git commit -m 'Backup optimized catalog images'
            git push
          fi
