<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manager de Catalog</title>
<style>body{font-family:Arial,sans-serif;background:#fff8f7;color:#68434a;margin:0}.wrap{max-width:850px;margin:40px auto;padding:20px}.panel{background:white;border:1px solid #eadbd5;border-radius:16px;padding:26px;margin-top:20px}h1,h2{font-family:Georgia,serif}input{display:block;box-sizing:border-box;width:100%;padding:12px;margin:8px 0 18px;border:1px solid #d7bfc3;border-radius:9px}button{border:0;border-radius:9px;padding:12px 20px;background:#7b3f4b;color:white;cursor:pointer}a{color:#7b3f4b}[hidden]{display:none!important}.muted{color:#856f76}</style></head>
<body><main class="wrap"><a href="./">← Înapoi la catalog</a><h1>Manager de Catalog</h1><section class="panel" id="login"><h2>Autentificare</h2><form id="form"><label>Email<input type="email" id="email" autocomplete="username" required></label><label>Parolă<input type="password" id="password" autocomplete="current-password" required></label><button type="submit">Conectare</button></form><p id="status" role="status"></p></section><section class="panel" id="admin" hidden><h2>Bun venit în manager</h2><p id="who"></p><p class="muted">Administrarea categoriilor, produselor și prețurilor va fi activată după configurarea tabelelor și a politicilor de acces în Supabase.</p><button id="logout">Deconectare</button></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function(){
 const client=window.supabase.createClient('https://zbfqhmiqjcvicqlidswo.supabase.co','sb_publishable_d81c4EtU4mkkqgBnVQi9HQ_nf7M2zFb');
 const ownerId='34fdefa2-fe5a-4365-aad1-10ec8f8abd37';
 const el=id=>document.getElementById(id);
 async function refresh(){const {data}=await client.auth.getUser();const user=data?.user;const allowed=user?.id===ownerId;el('login').hidden=!!allowed;el('admin').hidden=!allowed;if(allowed)el('who').textContent=user.email||'';if(user&&!allowed){await client.auth.signOut();el('status').textContent='Acest cont nu are acces la manager.'}}
 el('form').addEventListener('submit',async e=>{e.preventDefault();el('status').textContent='Se verifică…';const {error}=await client.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});el('password').value='';if(error){el('status').textContent='Autentificarea nu a reușit. Verifică emailul și parola.';return}el('status').textContent='';await refresh()});
 el('logout').addEventListener('click',async()=>{await client.auth.signOut();await refresh()});
 await refresh();
})();
</script></body></html>
